            const now = new Date();

            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            const dateEl = document.getElementById('date');
            const timeEl = document.getElementById('time');
            if (dateEl) dateEl.textContent = `${year}/${month}/${day}`;
            if (timeEl) timeEl.textContent = `${hours}:${minutes}:${seconds}`;

        let currentTab = 'creation';
        let currentFilter = '全部';

        function switchTab(tabKey) {
            currentTab = tabKey;
            currentFilter = '全部';

            document.querySelectorAll('.sidebar-btn').forEach(btn => {
                btn.classList.remove('sidebar-active');
            });
            const activeBtn = document.getElementById(`btn-${tabKey}`);
            if (activeBtn) activeBtn.classList.add('sidebar-active');

            renderContent();
        }

        function filterNovel(category) {
            currentFilter = category;
            renderContent();
        }

        function renderContent() {
            const container = document.getElementById('content-container');
            const data = dataStore[currentTab];
            if (!data) return;

            let html = `
                <div class="mb-6">
                    <h2 class="text-2xl font-bold text-white tracking-tight">${data.title}</h2>
                    <div class="w-12 h-1 bg-blue-500 rounded-full mt-2"></div>
                </div>
            `;

            if (data.hasFilter) {
                const filters = ['全部', '網文網站', '網文下載站', '輕小說網站', 'H-文網站'];
                html += `<div class="flex flex-wrap gap-2 mb-6">`;
                filters.forEach(f => {
                    const active = currentFilter === f;
                    const btnClass = active ? 'bg-blue-600 text-white shadow-md shadow-blue-500/20' : 'bg-gray-800 text-gray-300 hover:bg-gray-700 hover:text-white';
                    html += `<button onclick="filterNovel('${f}')" class="px-4 py-2 rounded-lg text-xs font-medium transition-all ${btnClass}">${f}</button>`;
                });
                html += `</div>`;
            }

            data.sections.forEach(section => {
                if (data.hasFilter && currentFilter !== '全部' && section.category !== currentFilter && section.name !== currentFilter) {
                    return;
                }
                const sectionTitle = section.name || section.category;

                html += `
                    <div class="mb-8 section-group" data-category="${sectionTitle}">
                        <h3 class="text-base font-semibold text-gray-300 mb-4 flex items-center space-x-2">
                            <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                            <span>${sectionTitle}</span>
                        </h3>
                        <div class="card-grid">
                `;

                section.items.forEach(item => {
                    if (item.status === 'dev') {
                        html += `
                            <div class="bg-gray-900/40 border-2 border-dashed border-gray-700 rounded-xl p-5 flex flex-col justify-between">
                                <div>
                                    <div class="flex items-center justify-between mb-2">
                                        <h4 class="font-bold text-base text-gray-200">${item.title}</h4>
                                        <span class="px-2 py-0.5 rounded text-[10px] bg-yellow-500/10 text-yellow-400 border border-yellow-500/20">項目開發中</span>
                                    </div>
                                    <p class="text-xs text-gray-400 leading-relaxed">${item.desc}</p>
                                </div>
                                <div class="mt-4 pt-3 border-t border-gray-800 text-[11px] text-gray-500 italic">準備建置中</div>
                            </div>
                        `;
                    } else if (item.status === 'empty') {
                        html += `
                            <div class="bg-gray-900/40 border-2 border-dashed border-gray-700 rounded-xl p-5 flex flex-col justify-between opacity-80">
                                <div>
                                    <div class="flex items-center justify-between mb-2">
                                        <h4 class="font-bold text-base text-gray-400">${item.title}</h4>
                                        <span class="px-2 py-0.5 rounded text-[10px] bg-gray-800 text-gray-400 border border-gray-700">暫無內容</span>
                                    </div>
                                    <p class="text-xs text-gray-500 leading-relaxed">${item.desc}</p>
                                </div>
                                <div class="mt-4 pt-3 border-t border-gray-800 text-[11px] text-gray-600">敬請期待</div>
                            </div>
                        `;
                    } else {
                        html += `
                            <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="bg-[#111827] border border-gray-800 rounded-xl p-5 card-hover flex flex-col justify-between group block">
                                <div>
                                    <div class="flex items-center justify-between mb-2">
                                        <h4 class="font-bold text-base text-gray-100 group-hover:text-blue-400 transition-colors">${item.title}</h4>
                                        <span class="text-xs text-gray-500 group-hover:text-blue-400 transition-colors">↗</span>
                                    </div>
                                    <p class="text-xs text-gray-400 leading-relaxed line-clamp-2">${item.desc}</p>
                                </div>
                                <div class="mt-4 pt-3 border-t border-gray-800/60 flex items-center justify-between text-[11px] text-gray-500 font-mono">
                                    <span class="truncate max-w-[180px]">${item.url}</span>
                                    <span class="text-blue-400 opacity-0 group-hover:opacity-100 transition-opacity">訪問</span>
                                </div>
                            </a>
                        `;
                    }
                });

                html += `</div></div>`;
            });

            container.innerHTML = html;
        }

        switchTab('creation');
    </script>
</body>
</html>
